name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & release Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=release
          storeFile=../release-keystore.jks
          EOF

      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi --dart-define=APP_VERSION=${{ github.ref_name }}

      - name: Build universal APK
        run: flutter build apk --release --dart-define=APP_VERSION=${{ github.ref_name }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Android Auto setup

            GitHub release APKs are sideloaded outside Google Play. Android
            Auto hides sideloaded apps by default, including release builds.

            On a Pixel, open **Settings → Connected devices → Connection
            preferences → Android Auto**. At the bottom, expand **Version and
            permission info** and tap it ten times, accept the prompt, then
            open the three-dot menu → **Developer settings** and enable
            **Unknown sources**. This is Android Auto's hidden setting, not
            Android's regular **Install unknown apps** permission. Then check
            **Customize launcher** to ensure **SR Podcasts** is enabled and
            reconnect the phone to the car.

      - name: Upload APK artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
