name: podcastshortcut
description: "A quick-access player for selected Sveriges Radio podcasts."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.0

dependencies:
  audio_session: ^0.2.4
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
